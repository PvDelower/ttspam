version: '3.8'

services:
  # Backend FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - TIKTOK_REDIRECT_URI=http://localhost:8000/api/tiktok/callback
      - STORAGE_DIR=/storage
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
      - backend-storage:/storage
    networks:
      - video-network
    restart: unless-stopped

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    networks:
      - video-network
    restart: unless-stopped
    depends_on:
      - backend

  # Tests service
  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    container_name: video-tests
    environment:
      - STORAGE_PATH=/storage
      - LOG_LEVEL=DEBUG
    volumes:
      - ./backend:/app
      - test-storage:/storage
    networks:
      - video-network
    depends_on:
      - backend

volumes:
  backend-storage:
  test-storage:

networks:
  video-network:
    driver: bridge
